services:
  app:
    image: inkclusive-backend
    build: .
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the backend .env file}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:?Set ADMIN_TOKEN_SECRET in the backend .env file}
    ports:
      - "8000:80"
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 80
